name: LLMOps Evaluation (Local)

on:
  workflow_dispatch:  # permite rodar manualmente
  pull_request:
    branches: [main]

env:
  MLFLOW_TRACKING_URI: http://127.0.0.1:5001
  OPENAI_API_KEY: ollama
  OPENAI_API_BASE: http://127.0.0.1:11434/v1

jobs:
  evaluate:
    runs-on: self-hosted  # usa seu MacBook
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: uv sync --python 3.13

      - name: Start MLflow server
        run: |
          uv run mlflow server \
            --host 127.0.0.1 \
            --port 5001 \
            --backend-store-uri sqlite:////tmp/mlruns-ci.db \
            --artifacts-destination /tmp/mlartifacts-ci &
          for i in $(seq 1 30); do
            curl -sf "http://127.0.0.1:5001/api/2.0/mlflow/experiments/search" \
              -X POST -H "Content-Type: application/json" -d '{"max_results":1}' \
              && break
            echo "Waiting for MLflow API... ($i/30)"
            sleep 2
          done
          # Force store initialisation — ensures get-by-name works before the script imports agents.py
          uv run python -c "
          import mlflow
          mlflow.set_tracking_uri('http://127.0.0.1:5001')
          mlflow.set_experiment('task-assistant')
          print('MLflow store initialised')
          "

      - name: Check Ollama is running
        run: |
          curl -sf http://127.0.0.1:11434/api/tags | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          models = [m['name'] for m in data.get('models', [])]
          print(f'Available models: {models}')
          if not any('llama3.1' in m for m in models):
              print('ERROR: llama3.1 not found in Ollama')
              sys.exit(1)
          "

      - name: Run evaluation
        run: |
          uv run python src/task_assistant/monitoring/run_evaluation.py

      - name: Check regression vs baseline
        run: |
          uv run python src/task_assistant/monitoring/check_regression.py

      - name: Upload evaluation results
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            src/task_assistant/monitoring/current_scores.json
            src/task_assistant/monitoring/evaluation_results/
