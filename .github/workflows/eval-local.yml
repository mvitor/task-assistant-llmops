name: LLMOps Evaluation (Local)

on:
  workflow_dispatch:  # permite rodar manualmente
  pull_request:
    branches: [main]

env:
  MLFLOW_TRACKING_URI: http://127.0.0.1:5000
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

jobs:
  evaluate:
    runs-on: self-hosted  # usa seu MacBook
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: uv sync --python 3.13

      - name: Start MLflow server
        run: |
          uv run mlflow server --host 127.0.0.1 --port 5000 &
          # Poll the experiments API — /health returns 200 before the store is ready
          for i in $(seq 1 30); do
            curl -sf "http://127.0.0.1:5000/api/2.0/mlflow/experiments/search" \
              -X POST -H "Content-Type: application/json" -d '{"max_results":1}' \
              && break
            echo "Waiting for MLflow API... ($i/30)"
            sleep 2
          done

      - name: Run evaluation
        run: |
          uv run python src/task_assistant/monitoring/run_evaluation.py

      - name: Check regression vs baseline
        run: |
          uv run python src/task_assistant/monitoring/check_regression.py

      - name: Upload evaluation results
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            src/task_assistant/monitoring/current_scores.json
            src/task_assistant/monitoring/evaluation_results/
