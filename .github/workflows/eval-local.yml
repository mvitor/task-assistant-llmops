name: LLMOps Evaluation (Local)

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

env:
  MLFLOW_TRACKING_URI: http://127.0.0.1:5000
  OPENAI_API_KEY: ollama
  OPENAI_API_BASE: http://127.0.0.1:11434/v1

jobs:
  evaluate:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: uv sync --python 3.13

      - name: Check Ollama is running
        run: |
          curl -sf http://127.0.0.1:11434/api/tags | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          models = [m['name'] for m in data.get('models', [])]
          print(f'Available models: {models}')
          if not any('qwen2.5' in m for m in models):
              print('ERROR: qwen2.5:14b not found in Ollama')
              sys.exit(1)
          "

      - name: Run evaluation
        run: |
          uv run python src/task_assistant/monitoring/run_evaluation.py

      - name: Check regression vs baseline
        run: |
          uv run python src/task_assistant/monitoring/check_regression.py

      - name: Upload evaluation results
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            src/task_assistant/monitoring/current_scores.json
            src/task_assistant/monitoring/evaluation_results/
